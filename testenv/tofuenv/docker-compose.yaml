networks:
  cloud-barista:
    driver: bridge

services:
  # ============================================================================
  # OpenBao (secrets management) in persistent mode
  #   Stores the CSP and DB credentials in KV v2 (secret/csp/*, secret/db/*).
  #
  #   First run :  ./scripts/up.sh  (or init/openbao/openbao-init.sh)
  #   Restart   :  ./scripts/up.sh  (unseals automatically)
  # ============================================================================
  openbao:
    image: openbao/openbao:2.5.1
    container_name: tofuenv-openbao
    cap_add:
      - IPC_LOCK
    networks:
      - cloud-barista
    ports:
      - target: 8200
        published: 38200
        protocol: tcp
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    # Fix bind-mount ownership (host UID -> the container's openbao UID 100).
    entrypoint: ["sh", "-c"]
    command:
      - |
        chown -R openbao:openbao /openbao/data || { echo "ERROR: chown failed on /openbao/data"; exit 1; }
        exec docker-entrypoint.sh server -config=/openbao/config/openbao-config.hcl
    volumes:
      - ./container-volume/openbao-data:/openbao/data
      - ./init/openbao/openbao-config.hcl:/openbao/config/openbao-config.hcl:ro
    healthcheck:
      # 'bao status' exit codes: 0=unsealed, 1=sealed, 2=uninitialized.
      # All three mean the process is alive and the API responds.
      test: ["CMD", "sh", "-c", "rc=0; bao status || rc=$$?; [ $$rc -le 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ============================================================================
  # OpenTofu runner - a long-lived container
  #   Ships tofu plus curl, jq, git and openssh-client. It stays up via sleep and
  #   scripts/*.sh drive it with docker exec.
  #   The whole tofuenv directory is mounted at /work, sharing the tofu modules,
  #   .env and ssh_keys.
  # ============================================================================
  tofu-runner:
    build:
      context: .
      dockerfile: Dockerfile.tofu-runner
    image: tofuenv-runner:local
    # This image is only ever built here, never published. Without an explicit
    # policy Compose tries the registry first and reports "pull access denied"
    # before falling back to the build.
    pull_policy: build
    container_name: tofuenv-runner
    networks:
      - cloud-barista
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      # From inside the container, reach OpenBao by its compose service name.
      - VAULT_ADDR=http://openbao:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-}
    env_file:
      - .env
    depends_on:
      openbao:
        condition: service_healthy
    command: ["sleep", "infinity"]
    restart: unless-stopped
