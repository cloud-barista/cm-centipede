          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_ListResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_MigrationLog'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: List logs for a migration
      tags:
      - migration
  /centipede/migration/{migrationId}/retry:
    post:
      consumes:
      - application/json
      description: Creates a new Migration that re-runs items from the original according
        to retryMode. DBMS destination tables are DROP-ped before re-execution.
      parameters:
      - description: Original Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      - description: 'Retry options (retryMode: partial|full, default: partial)'
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.RetryReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_RetryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Retry a failed or cancelled migration
      tags:
      - migration
  /centipede/migration/{migrationId}/validation:
    get:
      description: Returns the current validation status, summary message, and per-item
        detail list for the given migration.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_ValidationResultResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Get validation result for a migration
      tags:
      - validation
    post:
      description: Validates that the destination data matches the source after a
        completed migration. Returns 400 if migration is not completed, 409 if validation
        is already running.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_SimpleMessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Start validation for a completed migration
      tags:
      - validation
  /centipede/migration/all:
    get:
      description: |-
        Returns every matching migration summary ordered by created_at DESC.
        The response carries planSummary (unit counts per category) in place of the plan itself.
        When none of dateFrom, dateTo and lastDays is given, the last 7 calendar days are applied and the response message says so; pass lastDays=0 to lift the limit.
        Date filters compare against created_at and are interpreted in the server's local time zone.
      parameters:
      - description: Filter by status (pending|running|completed|failed|cancelled)
        in: query
        name: status
        type: string
      - description: Inclusive lower bound on created_at (yyyy-mm-dd)
        in: query
        name: dateFrom
        type: string
      - description: Inclusive upper bound on created_at (yyyy-mm-dd)
        in: query
        name: dateTo
        type: string
      - description: Last N calendar days including today (0-3650; 0 means no limit,
          default 7). Cannot be combined with dateFrom or dateTo
        in: query
        name: lastDays
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-array_github_com_cloud-barista_cm-centipede_pkg_api_rest_model_MigrationSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: List all migrations without pagination
      tags:
      - migration
  /centipede/plans/target:
    post:
      consumes:
      - application/json
      description: Validates source/destination connections, checks DBMS compatibility
        and version, and returns a TargetDataMigrationModel ready for CreateMigration.
      parameters:
      - description: Target plan request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.TargetPlanReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_dmdl_target-model_TargetDataMigrationModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Analyse target migration plan
      tags:
      - plan
  /centipede/readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-pkg_api_rest_controller_ReadyzResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Server readiness check
      tags:
      - utility
