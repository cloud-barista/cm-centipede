host: localhost:8085
info:
  contact:
    name: Cloud-Barista Community
    url: https://github.com/cloud-barista/cm-centipede
  description: Cloud-Barista cm-centipede — Multi-cloud filesystem, object storage,
    and DBMS data migration subsystem.
  title: cm-centipede API
  version: 1.0.0
paths:
  /centipede/migration:
    get:
      description: |-
        Returns a paginated list of migration summaries ordered by created_at DESC.
        The response carries planSummary (unit counts per category) in place of the plan itself.
        Date filters compare against created_at and are interpreted in the server's local time zone.
        dateFrom and dateTo may each be used alone for an open-ended range; dateTo includes its own day.
      parameters:
      - description: Filter by status (pending|running|completed|failed|cancelled)
        in: query
        name: status
        type: string
      - description: Inclusive lower bound on created_at (yyyy-mm-dd)
        in: query
        name: dateFrom
        type: string
      - description: Inclusive upper bound on created_at (yyyy-mm-dd)
        in: query
        name: dateTo
        type: string
      - description: Last N calendar days including today (0-3650; 0 means no limit).
          Cannot be combined with dateFrom or dateTo
        in: query
        name: lastDays
        type: integer
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_ListResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_MigrationSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: List migrations (paginated)
      tags:
      - migration
    post:
      consumes:
      - application/json
      description: Creates a Migration record from the given plan and immediately
        starts execution asynchronously.
      parameters:
      - description: Migration creation request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.CreateMigrationReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_Migration'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Create and start a migration
      tags:
      - migration
  /centipede/migration/{migrationId}:
    delete:
      description: Deletes a migration record. Returns 409 if the migration is currently
        running — cancel it first.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Delete a migration
      tags:
      - migration
    get:
      description: Returns the Migration record for the given ID.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_Migration'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Get a single migration
      tags:
      - migration
  /centipede/migration/{migrationId}/cancel:
    post:
      description: Signals the running migration to stop after the current item finishes.
        Returns 404 if the migration is not currently running.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-github_com_cloud-barista_cm-centipede_pkg_api_rest_model_Migration'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_cloud-barista_cm-centipede_pkg_api_rest_model.ApiResponse-any'
      summary: Cancel a running migration
      tags:
      - migration
  /centipede/migration/{migrationId}/logs:
    get:
      description: Returns paginated MigrationLog entries for the given migration
        ID, optionally filtered by status.
      parameters:
      - description: Migration ID
        in: path
        name: migrationId
        required: true
        type: string
      - description: Filter by status (success|failed|skipped)
        in: query
        name: status
        type: string
      - description: Page number (default 1)
        in: query
