# Every value shipped as ChangeMe must be replaced before cm-centipede starts:
# the server refuses to run while any of them is still "changeme" (compared
# case-insensitively). Set them here or through the matching CENTIPEDE_*
# environment variables.
centipede:
  self:
    endpoint: localhost:8085
  honeybee:
    endpoint: http://localhost:8081
    privateKeyPath: ~/.cm-honeybee/honeybee.key
  beetle:
    endpoint: http://localhost:8056
    username: ChangeMe
    password: ChangeMe
  tumblebug:
    # Object storage transfers only (transx-ex reaches managed buckets through
    # cb-tumblebug). Not selectable as a connection source.
    #
    # Host and port only, like the beetle endpoint above: cm-centipede appends
    # cb-tumblebug's "/tumblebug" route prefix itself, the same way the beetle
    # client appends "/beetle". An endpoint that already carries the prefix is
    # left unchanged.
    endpoint: http://localhost:1323
    username: ChangeMe
    password: ChangeMe
  api:
    allow:
      origins: "*"
    auth:
      enabled: true
      mode: basic
    # Leave username and password empty when auth.enabled is false.
    username: ChangeMe
    password: ChangeMe
    rateLimit: 20
  db:
    path: ./db/cm-centipede.db
  encryption:
    # Passphrase the connection credentials are encrypted with. Required: the
    # server will not start without it. Any passphrase of 12+ characters; it is
    # stretched into an AES-256 key with scrypt and a salt generated per
    # database, so it never has to be a particular length or encoding.
    #
    # The shipped ChangeMe is refused at startup, like every ChangeMe in this
    # file. Pick a value once and keep it: losing or changing the value makes
    # every stored credential unrecoverable.
    # Override with CENTIPEDE_ENCRYPTION_SECRET_KEY.
    secretKey: ChangeMe
  logfile:
    path: ./log/cm-centipede.log
    maxsize: 1000
    maxbackups: 3
    maxage: 30
  # trace | debug | info | warn | error | fatal.
  # Note that "trace" and "debug" also switch GORM to its Info level, which
  # prints every SQL statement to stdout; keep "info" unless that is wanted.
  loglevel: info
  logwriter: both
  node:
    env: development
